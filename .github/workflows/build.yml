name: Build Arc

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VST3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target Arc_VST3 --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Arc-Windows-VST3
          path: build/Arc_artefacts/Release/VST3/

  macos:
    name: macOS (VST3 + AU, universel)
    runs-on: macos-15-intel   # Mac Intel : file Apple Silicon saturée (binaire universel quand même)
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target Arc_VST3 Arc_AU --parallel 4

      - name: Ad-hoc signing
        run: |
          codesign --force --deep -s - "build/Arc_artefacts/Release/VST3/Arc.vst3"
          codesign --force --deep -s - "build/Arc_artefacts/Release/AU/Arc.component"

      - name: Upload VST3 + AU
        uses: actions/upload-artifact@v4
        with:
          name: Arc-macOS-VST3-AU
          path: |
            build/Arc_artefacts/Release/VST3/
            build/Arc_artefacts/Release/AU/

  # Publie la version (tag v<VERSION de CMakeLists>) en Release GitHub, fichiers a nom fixe :
  # les boutons du README (.../releases/latest/download/Arc-VST3-<OS>.zip) suivent chaque version.
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: v
        run: echo "version=$(python3 -c "import re;print(re.search(r'^project\s*\(\s*\w+[^)]*?VERSION\s+([0-9.]+)',open('CMakeLists.txt').read(),re.M).group(1))")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Arc-Windows-VST3
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: Arc-macOS-VST3-AU
          path: dist/mac
      - name: Archives
        run: |
          pack() {
            src="$1"; out="$GITHUB_WORKSPACE/$2"; wrap="$3"
            n=$(ls -A "$src" | wc -l); z=$(ls "$src"/*.zip 2>/dev/null | head -1)
            if [ "$n" = 1 ] && [ -n "$z" ]; then cp "$z" "$out"
            elif [ -n "$wrap" ]; then mkdir -p "pk/$wrap" && cp -a "$src"/. "pk/$wrap/" && (cd pk && zip -r -q -y "$out" "$wrap") && rm -rf pk
            else (cd "$src" && zip -r -q -y "$out" .); fi
          }
          pack dist/win "Arc-VST3-Windows.zip" ""
          pack dist/mac "Arc-VST3-macOS.zip" ""
          ls -l *.zip
      - name: Notice
        run: |
          # derniere notice du dossier docs/ (hors guide MIDI), publiee sous un nom fixe
          N=$(ls docs/*.pdf 2>/dev/null | grep -vi midi | sort -V | tail -1 || true)
          if [ -n "$N" ]; then cp "$N" Arc-Notice.pdf; echo "notice : $N"; else echo "pas de notice"; fi
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          FILES="Arc-VST3-Windows.zip Arc-VST3-macOS.zip"
          [ -f Arc-Notice.pdf ] && FILES="$FILES Arc-Notice.pdf"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" --latest --title "ARC $TAG" --notes "Installation : voir le README (Windows : C:\Program Files\Common Files\VST3 ; macOS : ~/Library/Audio/Plug-Ins/VST3)."
          fi
